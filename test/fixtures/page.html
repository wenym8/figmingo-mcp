<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ACME — fixture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; width: 1440px; }
  header.topbar {
    width: 1440px; height: 64px; background: #f5f7fa;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
  }
  header .logo { font-weight: 700; font-size: 20px; letter-spacing: 0.5px; text-transform: uppercase; color: #111111; }
  header nav a { font-size: 14px; color: #333333; text-decoration: none; }
  section.hero {
    width: 1440px; height: 500px; padding: 80px 120px;
    background: linear-gradient(90deg, #f0f7fc 0%, #ffffff 100%);
  }
  section.hero h1 { font-size: 56px; line-height: 64px; letter-spacing: -1px; color: #111111; width: 700px; font-weight: 700; }
  section.hero p.sub { font-size: 18px; line-height: 28px; color: #545454; width: 620px; margin-top: 16px; }
  a.btn {
    display: inline-block; margin-top: 32px; width: 180px; height: 48px; line-height: 48px;
    background: #005a88; color: #ffffff; border-radius: 8px; text-align: center;
    font-size: 16px; font-weight: 600; text-decoration: none;
  }
  .hero-img {
    position: absolute; left: 900px; top: 144px; width: 400px; height: 300px; border-radius: 12px;
    background: #dde5ea; object-fit: cover;
  }
  .check-row { position: absolute; left: 120px; top: 600px; width: 24px; height: 24px; }
  footer.footer {
    position: absolute; top: 800px; left: 0; width: 1440px; height: 100px; background: #111111;
    padding: 40px 32px;
  }
  footer .copy { color: rgba(255, 255, 255, 0.8); font-size: 14px; line-height: 20px; width: 300px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="logo">ACME</div>
    <nav><a href="#signin">Sign in</a></nav>
  </header>
  <section class="hero">
    <h1>Build faster with ACME</h1>
    <p class="sub">Ship pixel-perfect pages from your designs.</p>
    <a class="btn" href="#start">Get started</a>
  </section>
  <img class="hero-img" alt="product screenshot" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" />
  <svg class="check-row" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 12l5 5L20 7" stroke="#00929c" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <footer class="footer">
    <p class="copy">© 2026 ACME Inc.</p>
  </footer>
</body>
</html>
